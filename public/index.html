<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TasteProof</title><style>body{background:#101827;color:#f1f6ff;font:17px system-ui;margin:6vh auto;max-width:740px;padding:20px}h1{font-size:3em}p{color:#bac9db}form,article{background:#1c2a3d;border-radius:16px;padding:24px;margin:16px 0}input,select,button{padding:14px;border-radius:9px;border:0;font-size:16px}button{background:#bbdbff;cursor:pointer;font-weight:700}input{max-width:90%;width:350px}small{color:#abc0d8}</style></head><body><h1>TasteProof</h1><p>Grounded cultural discovery — cultural affinities are evidence about groups, not certainty about you.</p><form id="f"><label>Artist, filmmaker, film or book<br><input id="signal" value="Christopher Nolan" maxlength="100"></label><p>Find <select id="type"><option value="movie">Movies</option><option value="artist">Artists</option><option value="book">Books</option><option value="tv_show">TV</option></select> <button>Explore</button></p></form><div id="out" aria-live="polite"></div><p><small>Qloo results are candidate affinities only. Inferred taste is not a verified personal preference.</small></p><script>document.querySelector('#f').onsubmit=async e=>{e.preventDefault();const out=document.querySelector('#out');out.textContent='Querying Qloo…';try{const r=await fetch('/api/recommend',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({signals:[document.querySelector('#signal').value],targetType:document.querySelector('#type').value})});const d=await r.json();out.replaceChildren();const h=document.createElement('h2');h.textContent=d.summary||d.error||'No results';out.append(h);if(d.candidates){const p=document.createElement('p');p.textContent='Possible matches: '+d.candidates.map(c=>c.name).join(', ');out.append(p)}for(const v of d.recommendations||[]){const a=document.createElement('article'),b=document.createElement('strong'),p=document.createElement('p'),s=document.createElement('small');b.textContent=v.entity;p.textContent=v.state+' — '+v.reason;s.textContent=(v.evidence||[]).join('; ');a.append(b,p,s);out.append(a)}}catch{out.textContent='Upstream unavailable.'}};</script></body></html>
